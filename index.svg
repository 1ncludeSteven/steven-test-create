<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5a2b"/>
      <stop offset="1" stop-color="#5c3a1e"/>
    </linearGradient>
    <linearGradient id="woodSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a4a22"/>
      <stop offset="0.5" stop-color="#6b3f1c"/>
      <stop offset="1" stop-color="#5c3a1e"/>
    </linearGradient>
    <linearGradient id="vinylGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="0.5" stop-color="#111"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="topDeck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0e0e0"/>
      <stop offset="0.5" stop-color="#b0b0b0"/>
      <stop offset="1" stop-color="#909090"/>
    </linearGradient>
    <radialGradient id="labelGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5edda"/>
      <stop offset="1" stop-color="#e8dfc5"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="#f5f0e8"/>

  <!-- Card -->
  <rect x="100" y="80" width="1400" height="840" rx="24" fill="#faf7f2"/>

  <!-- Header Title -->
  <text x="140" y="150" font-family="Georgia, serif" font-size="56" font-weight="bold" fill="#2c2318" letter-spacing="4">ATELIER 33</text>
  <text x="140" y="192" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#5c4a38">A premium desktop record player, settling into its music</text>

  <!-- Chapter indicator (top right) - each chapter is filled for its window, outlined otherwise -->
  <g font-family="Georgia, serif" font-size="20" text-anchor="middle">
    <!-- I: filled 0-2s, outlined after -->
    <circle cx="1220" cy="150" r="20" fill="#2c2318">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.09;0.11;1" dur="20s" repeatCount="indefinite"/>
    </circle>
    <text x="1220" y="157" fill="#faf7f2">I
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.09;0.11;1" dur="20s" repeatCount="indefinite"/>
    </text>
    <circle cx="1220" cy="150" r="20" fill="none" stroke="#8a7a68" stroke-width="1.5">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.09;0.11;1" dur="20s" repeatCount="indefinite"/>
    </circle>
    <text x="1220" y="157" fill="#2c2318">I
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.09;0.11;1" dur="20s" repeatCount="indefinite"/>
    </text>

    <!-- II: filled 2-4s -->
    <circle cx="1270" cy="150" r="20" fill="#2c2318">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.09;0.11;0.19;0.21;1" dur="20s" repeatCount="indefinite"/>
    </circle>
    <text x="1270" y="157" fill="#faf7f2">II
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.09;0.11;0.19;0.21;1" dur="20s" repeatCount="indefinite"/>
    </text>
    <circle cx="1270" cy="150" r="20" fill="none" stroke="#8a7a68" stroke-width="1.5">
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.09;0.11;0.19;0.21;1" dur="20s" repeatCount="indefinite"/>
    </circle>
    <text x="1270" y="157" fill="#2c2318">II
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.09;0.11;0.19;0.21;1" dur="20s" repeatCount="indefinite"/>
    </text>

    <!-- III: filled 4-6s -->
    <circle cx="1320" cy="150" r="20" fill="#2c2318">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.21;0.29;0.31;1" dur="20s" repeatCount="indefinite"/>
    </circle>
    <text x="1320" y="157" fill="#faf7f2">III
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.21;0.29;0.31;1" dur="20s" repeatCount="indefinite"/>
    </text>
    <circle cx="1320" cy="150" r="20" fill="none" stroke="#8a7a68" stroke-width="1.5">
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.19;0.21;0.29;0.31;1" dur="20s" repeatCount="indefinite"/>
    </circle>
    <text x="1320" y="157" fill="#2c2318">III
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.19;0.21;0.29;0.31;1" dur="20s" repeatCount="indefinite"/>
    </text>

    <!-- IV: filled 6-8s -->
    <circle cx="1370" cy="150" r="20" fill="#2c2318">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.29;0.31;0.39;0.41;1" dur="20s" repeatCount="indefinite"/>
    </circle>
    <text x="1370" y="157" fill="#faf7f2">IV
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.29;0.31;0.39;0.41;1" dur="20s" repeatCount="indefinite"/>
    </text>
    <circle cx="1370" cy="150" r="20" fill="none" stroke="#8a7a68" stroke-width="1.5">
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.29;0.31;0.39;0.41;1" dur="20s" repeatCount="indefinite"/>
    </circle>
    <text x="1370" y="157" fill="#2c2318">IV
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.29;0.31;0.39;0.41;1" dur="20s" repeatCount="indefinite"/>
    </text>

    <!-- V: filled 8s onward -->
    <circle cx="1420" cy="150" r="20" fill="#2c2318">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.39;0.41;1" dur="20s" repeatCount="indefinite"/>
    </circle>
    <text x="1420" y="157" fill="#faf7f2">V
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.39;0.41;1" dur="20s" repeatCount="indefinite"/>
    </text>
    <circle cx="1420" cy="150" r="20" fill="none" stroke="#8a7a68" stroke-width="1.5">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.39;0.41;1" dur="20s" repeatCount="indefinite"/>
    </circle>
    <text x="1420" y="157" fill="#2c2318">V
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.39;0.41;1" dur="20s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Record Player (isometric) -->
  <g transform="translate(700, 420)" filter="url(#softShadow)">

    <!-- Feet -->
    <ellipse cx="-280" cy="270" rx="20" ry="8" fill="#1a1a1a"/>
    <ellipse cx="280" cy="270" rx="20" ry="8" fill="#1a1a1a"/>

    <!-- Plinth top deck -->
    <polygon points="-320,-40 320,-40 380,40 -380,40" fill="url(#topDeck)" stroke="#111" stroke-width="2"/>
    <!-- Front face -->
    <polygon points="-380,40 380,40 380,240 -380,240" fill="url(#woodSide)" stroke="#3a2a18" stroke-width="1"/>
    <!-- Right side face -->
    <polygon points="380,40 320,-40 320,160 380,240" fill="url(#woodGrad)" stroke="#3a2a18" stroke-width="1"/>
    <!-- Gold trims -->
    <line x1="-380" y1="60" x2="380" y2="60" stroke="#c9a54a" stroke-width="2"/>
    <line x1="-380" y1="220" x2="380" y2="220" stroke="#c9a54a" stroke-width="2"/>
    <line x1="380" y1="60" x2="320" y2="-20" stroke="#c9a54a" stroke-width="1.5"/>
    <!-- Front knob -->
    <circle cx="-300" cy="140" r="12" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
    <circle cx="-300" cy="140" r="6" fill="#333"/>
    <!-- Front lever -->
    <rect x="0" y="130" width="30" height="6" rx="3" fill="#888" stroke="#555" stroke-width="0.5"/>
    <circle cx="15" cy="133" r="5" fill="#aaa"/>

    <!-- Platter -->
    <ellipse cx="0" cy="20" rx="220" ry="50" fill="#2a2a2a" stroke="#111" stroke-width="2"/>
    <ellipse cx="0" cy="10" rx="200" ry="45" fill="url(#metalGrad)" stroke="#888" stroke-width="1"/>

    <!-- Belt mechanism (visible only at start, fades as record descends) -->
    <g opacity="1">
      <circle cx="100" cy="55" r="15" fill="#555" stroke="#333" stroke-width="1"/>
      <circle cx="100" cy="55" r="8" fill="#777"/>
      <ellipse cx="-30" cy="60" rx="70" ry="10" fill="none" stroke="#222" stroke-width="3"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.2;0.3;1" dur="20s" repeatCount="indefinite"/>
    </g>

    <!-- Record -->
    <g>
      <ellipse cx="0" cy="0" rx="200" ry="45" fill="url(#vinylGrad)" stroke="#000" stroke-width="1"/>
      <ellipse cx="0" cy="0" rx="180" ry="40" fill="none" stroke="#333" stroke-width="0.5"/>
      <ellipse cx="0" cy="0" rx="160" ry="36" fill="none" stroke="#2a2a2a" stroke-width="0.5"/>
      <ellipse cx="0" cy="0" rx="140" ry="31" fill="none" stroke="#333" stroke-width="0.5"/>
      <ellipse cx="0" cy="0" rx="120" ry="27" fill="none" stroke="#2a2a2a" stroke-width="0.5"/>
      <ellipse cx="0" cy="0" rx="100" ry="22" fill="none" stroke="#333" stroke-width="0.5"/>
      <ellipse cx="0" cy="0" rx="80" ry="18" fill="none" stroke="#2a2a2a" stroke-width="0.5"/>
      <ellipse cx="0" cy="0" rx="55" ry="12" fill="url(#labelGrad)" stroke="#c9b88a" stroke-width="1"/>
      <ellipse cx="0" cy="0" rx="5" ry="2" fill="#111"/>
      <!-- Spinning notch -->
      <ellipse cx="150" cy="0" rx="8" ry="2" fill="#444">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.8s" repeatCount="indefinite"/>
      </ellipse>
      <!-- Float/descend animation -->
      <animateTransform attributeName="transform" type="translate"
        values="0,-140; 0,-140; 0,-100; 0,-40; 0,-10; 0,0; 0,0"
        keyTimes="0; 0.1; 0.2; 0.35; 0.45; 0.5; 1"
        dur="20s" repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>
    </g>

    <!-- Tonearm -->
    <g transform="translate(300, -10)">
      <circle cx="0" cy="0" r="18" fill="url(#metalGrad)" stroke="#888" stroke-width="1"/>
      <circle cx="0" cy="0" r="10" fill="#666"/>
      <g>
        <line x1="0" y1="0" x2="-250" y2="-40" stroke="url(#metalGrad)" stroke-width="6" stroke-linecap="round"/>
        <rect x="-270" y="-50" width="30" height="18" rx="3" fill="#aaa" stroke="#777" stroke-width="1" transform="rotate(-10 -255 -41)"/>
        <circle cx="20" cy="10" r="12" fill="#555" stroke="#333" stroke-width="1"/>
        <animateTransform attributeName="transform" type="rotate"
          values="-30 0 0; -30 0 0; -28 0 0; -15 0 0; -2 0 0; 8 0 0; 8 0 0"
          keyTimes="0; 0.45; 0.5; 0.55; 0.6; 0.65; 1"
          dur="20s" repeatCount="indefinite"
          calcMode="spline"
          keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>
      </g>
    </g>
  </g>

  <!-- Bottom control bar -->
  <g transform="translate(140, 850)">
    <circle cx="20" cy="20" r="22" fill="none" stroke="#5c4a38" stroke-width="2"/>
    <rect x="13" y="10" width="5" height="20" fill="#2c2318"/>
    <rect x="22" y="10" width="5" height="20" fill="#2c2318"/>
    <circle cx="80" cy="20" r="22" fill="none" stroke="#5c4a38" stroke-width="2"/>
    <path d="M 72 15 A 10 10 0 1 0 80 10" fill="none" stroke="#2c2318" stroke-width="2"/>
    <polygon points="80,5 80,15 85,10" fill="#2c2318"/>
    <line x1="130" y1="20" x2="700" y2="20" stroke="#c9b88a" stroke-width="2"/>
    <line x1="130" y1="20" x2="160" y2="20" stroke="#8b6f47" stroke-width="2">
      <animate attributeName="x2" values="160;700" dur="20s" repeatCount="indefinite"/>
    </line>
    <circle cx="160" cy="20" r="8" fill="#c9a54a" stroke="#8b6f47" stroke-width="1">
      <animate attributeName="cx" values="160;700" dur="20s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
